<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 95">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;700&amp;display=swap');
    </style>
  </defs>

  <!-- GROUND -->
  <text x="0" y="40"
        font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
        font-weight="300"
        font-size="48"
        letter-spacing="6"
        fill="#FFFFFF">GROUND</text>

  <!-- TRUTH -->
  <text x="0" y="88"
        font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
        font-weight="700"
        font-size="48"
        letter-spacing="6"
        fill="#FFFFFF">TRUTH</text>

  <!-- Subtle accent line between the two words -->
  <rect x="0" y="52" width="56" height="3" fill="#FFFFFF" opacity="0.6" rx="1.5"/>
</svg>
